[project]
name = "manualsearch"
version = "0.1.0"
description = "PDFマニュアルの全文検索システム（SQLite FTS5 + OCR）"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "pytesseract>=0.3.10",
    "pillow>=10.0",
    "openai>=1.30",
]

[project.scripts]
manualsearch = "manualsearch.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["manualsearch"]

[tool.setuptools.package-data]
manualsearch = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
